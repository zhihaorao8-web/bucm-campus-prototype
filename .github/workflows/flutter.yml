name: Flutter Android checks and APKs

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Check changes, run full host checks, or build dual previews
        type: choice
        options: [changed, full, preview]
        default: changed

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_HOSTED_URL: https://pub.dev
  PUB_CACHE: ${{ github.workspace }}\build\pub-cache

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.scope.outputs.sha }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Pin source, comparison base and required checks
        id: scope
        run: python scripts/ci_plan.py plan
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        if: steps.scope.outputs.java == 'true' && steps.scope.outputs.flutter != 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.scope.outputs.node == 'true'
        with:
          node-version: '22'
      - uses: ./.github/actions/flutter-environment
        if: steps.scope.outputs.flutter == 'true'
      - name: Prepare pinned XLS dependencies for host-only checks
        if: steps.scope.outputs.deps == 'true' && steps.scope.outputs.flutter != 'true'
        run: python scripts/dependencies.py
      - name: Run selected checks
        run: python scripts/ci_plan.py run
      - name: Preserve scope and check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: campus-checks-${{ github.sha }}
          path: |
            build/ci-plan.json
            build/checks/*.json
          if-no-files-found: warn
          retention-days: 14

  preview:
    name: dual-preview
    needs: quality
    if: needs.quality.outputs.preview == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.quality.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/flutter-environment
      - name: Build debug and release previews sequentially
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.quality.outputs.sha }}
        run: ./scripts/build_flutter_previews.ps1 -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: campus-flutter-apks-${{ needs.quality.outputs.sha }}
          path: build/flutter-previews/**/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve detailed build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: campus-flutter-build-logs-${{ needs.quality.outputs.sha }}
          path: build/flutter-preview-logs/*.log
          if-no-files-found: warn
          retention-days: 14
