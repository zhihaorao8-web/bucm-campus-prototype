name: Flutter synthetic checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: windows-latest
    env:
      PUB_HOSTED_URL: https://pub.dev
      # Kotlin incremental compilation on Windows requires package sources and
      # the Android project to share a drive (runner profile is on C:, repo D:).
      PUB_CACHE: ${{ github.workspace }}\build\pub-cache
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare pinned Flutter SDK
        shell: pwsh
        run: |
          git -c core.longpaths=true clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git build/flutter-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $revision = git -C build/flutter-ci rev-parse HEAD
          if ($revision -ne 'c197ca5199e9ee5661e865596c9c07294dfab51c') { throw 'Flutter revision mismatch' }
          "${{ github.workspace }}\build\flutter-ci\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare public parsers and dependencies
        run: |
          python scripts/dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_flutter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Flutter analysis and synthetic tests
        working-directory: mobile
        run: |
          # The local lock uses the China mirror. On hosted CI use the official
          # endpoint, retaining every locked version and SHA-256 verbatim.
          $lock = (Get-Content pubspec.lock -Raw).Replace('https://pub.flutter-io.cn', 'https://pub.dev')
          [System.IO.File]::WriteAllText((Join-Path $PWD 'pubspec.lock'), $lock)
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release-mode preview APK
        working-directory: mobile
        run: flutter build apk --release --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: campus-flutter-release-preview-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
