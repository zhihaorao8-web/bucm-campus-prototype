name: Prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Offline synthetic checks
        run: python scripts/check.py
      - name: Prepare Android SDK
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) { throw 'ANDROID_HOME is not available' }
          $sdkManagerPath = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManagerPath 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify development APK
        shell: pwsh
        run: python build.py --sdk "$env:ANDROID_HOME" --work build/ci --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bucm-prototype-ci-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
