name: campus_schedule
description: 北京中医药大学校园课表，官方登录与本机离线查看。
publish_to: none
# Generated from AndroidManifest.xml; two-part Android labels gain .0 for SemVer.
version: 0.3.0+12
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.5
  flutter_miuix: 1.3.0
  flutter_svg: 2.4.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/iconmcp/
    - assets/extract.js
    - assets/school-viewport.js
    - assets/export-nav.js
    - assets/coverage-check.js
    - assets/classroom.js
    - assets/classroom-entry.js
    - assets/recording-api.cjs
    - assets/recording-api-bridge.js
    - assets/library-seat-read.js
    - assets/library-seat-write.js
    - assets/app-icon.png
    - assets/developer-avatar.png
